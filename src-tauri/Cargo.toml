[package]
name = "novel-studio"
version = "0.1.0"
description = "AI novel writing studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "novel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
base64 = "0.22"
# 番茄官方 API 直连（请求签名 + 正文解密），替代社区中继；MIT，锁定 rev
fanqie-rs = { git = "https://github.com/ZreXoc/fanqie-rs", rev = "906c6fd5744af0ef49e529102cdb64a250c067f7" }
