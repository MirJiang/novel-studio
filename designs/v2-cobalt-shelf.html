<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>V2 群青 · 书架 — Novel Studio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:#DCDCE0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .serif{font-family:"Songti SC","STSong","SimSun",serif}

  .win{
    width:1280px;height:820px;border-radius:12px;overflow:hidden;
    background:#FCFCFA;display:flex;flex-direction:column;
    box-shadow:0 32px 80px rgba(30,32,60,.3),0 4px 16px rgba(30,32,60,.18);
  }
  /* 群青标题栏：承诺色整片占据 */
  .caption{
    height:48px;flex-shrink:0;display:flex;align-items:center;
    background:#2440C0;padding-left:16px;user-select:none;
  }
  .caption .app{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.02em}
  .caption .app .logo{
    width:19px;height:19px;border-radius:5px;background:#fff;color:#2440C0;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
  }
  .caption .sub{font-size:11px;color:rgba(255,255,255,.55);margin-left:14px;letter-spacing:.1em}
  .win-controls{margin-left:auto;display:flex;height:100%}
  .wbtn{
    width:46px;height:100%;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);
  }
  .wbtn:hover{background:rgba(255,255,255,.14);color:#fff}
  .wbtn.close:hover{background:#E81123}
  .wbtn svg{width:12px;height:12px}

  .body{flex:1;overflow-y:auto;padding:44px 52px}
  .shelf-head{display:flex;align-items:flex-end;gap:16px}
  .shelf-head h1{
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:38px;font-weight:900;color:#141412;letter-spacing:-0.01em;line-height:1;
  }
  .shelf-head .cnt{font-size:12.5px;color:#8A887F;padding-bottom:6px}
  .new-book{
    margin-left:auto;margin-bottom:4px;display:flex;align-items:center;gap:7px;
    background:#2440C0;color:#fff;border:none;border-radius:8px;
    font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;cursor:pointer;
  }
  .new-book:hover{background:#1B3299}
  .new-book svg{width:12px;height:12px}

  .grid{
    margin-top:36px;display:grid;gap:32px;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  }
  .book{cursor:pointer;background:none;border:none;text-align:left;font-family:inherit}
  .cover{
    aspect-ratio:3/4;border-radius:4px;position:relative;overflow:hidden;
    box-shadow:0 3px 10px rgba(20,20,18,.14);
    transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;
  }
  .book:hover .cover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,20,18,.22)}
  /* 出版物封面：色块 + 文字编排 */
  .cover .ct{position:absolute;inset:0;padding:18px 16px;display:flex;flex-direction:column}
  .cover .num{font-size:10px;letter-spacing:.25em;color:rgba(255,255,255,.6)}
  .cover .ttl{
    font-family:"Songti SC","SimSun",serif;font-size:21px;font-weight:900;
    color:#fff;letter-spacing:.06em;line-height:1.45;margin-top:8px;
  }
  .cover .gen{
    margin-top:auto;font-size:10px;color:rgba(255,255,255,.65);letter-spacing:.2em;
    border-top:1px solid rgba(255,255,255,.35);padding-top:8px;
  }
  .c1{background:#B4483C}
  .c2{background:#2440C0}
  .c3{background:#3F6148}
  .c4{background:#141412}
  .meta{margin-top:11px}
  .meta .nm{font-size:13.5px;font-weight:600;color:#141412}
  .meta .st{font-size:11px;color:#8A887F;margin-top:3px}

  .add{
    aspect-ratio:3/4;border-radius:4px;cursor:pointer;
    background:#F0EFE9;color:#8A887F;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    font-size:12px;border:none;font-family:inherit;transition:background .2s;
  }
  .add:hover{background:#E6E5DD;color:#141412}
  .add svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="win">
  <div class="caption">
    <div class="app"><div class="logo">N</div>Novel Studio</div>
    <div class="sub">AI 小说创作工作室</div>
    <div class="win-controls">
      <button class="wbtn"><svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wbtn"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wbtn close"><svg viewBox="0 0 12 12"><path d="M3 3 L9 9 M9 3 L3 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <div class="body">
    <div class="shelf-head">
      <h1 class="serif">我的书架</h1>
      <span class="cnt">4 部作品 · 26.3 万字</span>
      <button class="new-book"><svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6"/></svg>新建作品</button>
    </div>

    <div class="grid">
      <button class="book">
        <div class="cover c1"><div class="ct"><div class="num">VOL.1</div><div class="ttl serif">烬上花开</div><div class="gen">仙侠 · 连载中</div></div></div>
        <div class="meta"><div class="nm">烬上花开</div><div class="st">12 章 · 4.2 万字 · 2 小时前</div></div>
      </button>
      <button class="book">
        <div class="cover c2"><div class="ct"><div class="num">VOL.1</div><div class="ttl serif">北纬三十七</div><div class="gen">都市 · 连载中</div></div></div>
        <div class="meta"><div class="nm">北纬三十七</div><div class="st">3 章 · 8,600 字 · 昨天</div></div>
      </button>
      <button class="book">
        <div class="cover c3"><div class="ct"><div class="num">VOL.1</div><div class="ttl serif">长风帖</div><div class="gen">武侠 · 存稿中</div></div></div>
        <div class="meta"><div class="nm">长风帖</div><div class="st">27 章 · 11.4 万字 · 3 天前</div></div>
      </button>
      <button class="book">
        <div class="cover c4"><div class="ct"><div class="num">VOL.2</div><div class="ttl serif">夜班出租车司机</div><div class="gen">悬疑 · 连载中</div></div></div>
        <div class="meta"><div class="nm">夜班出租车司机</div><div class="st">8 章 · 3.1 万字 · 上周</div></div>
      </button>
      <button class="add">
        <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4"/></svg>
        新建作品
      </button>
    </div>
  </div>
</div>
</body>
</html>
