<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>V1 石墨 · 书架 — Novel Studio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:#101012;min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .serif{font-family:"Songti SC","STSong","SimSun",serif}

  /* 无边框窗口 */
  .win{
    width:1280px;height:820px;border-radius:12px;overflow:hidden;
    background:#1E1F22;display:flex;flex-direction:column;
    box-shadow:0 32px 80px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.4);
    outline:1px solid rgba(255,255,255,.07);
  }
  /* 自定义标题栏（可拖拽区） */
  .caption{
    height:44px;flex-shrink:0;display:flex;align-items:center;
    background:#1A1B1E;padding-left:14px;user-select:none;
  }
  .caption .app{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#A9A7A2}
  .caption .app .logo{
    width:18px;height:18px;border-radius:5px;background:#E0A458;color:#1A1B1E;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  }
  .win-controls{margin-left:auto;display:flex;height:100%}
  .wbtn{
    width:46px;height:100%;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#A9A7A2;
  }
  .wbtn:hover{background:rgba(255,255,255,.07);color:#EDECEA}
  .wbtn.close:hover{background:#E81123;color:#fff}
  .wbtn svg{width:12px;height:12px}

  .body{flex:1;overflow-y:auto;padding:40px 48px}
  .shelf-head{display:flex;align-items:baseline;gap:14px}
  .shelf-head h1{font-size:26px;font-weight:600;color:#EDECEA;letter-spacing:-0.01em}
  .shelf-head span{font-size:12.5px;color:#7C7B77}
  .new-book{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    background:#E0A458;color:#1A1B1E;border:none;border-radius:8px;
    font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;cursor:pointer;
  }
  .new-book:hover{background:#EAB672}
  .new-book svg{width:12px;height:12px}

  .grid{
    margin-top:32px;display:grid;gap:28px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  }
  .book{cursor:pointer;background:none;border:none;text-align:left;font-family:inherit}
  .cover{
    aspect-ratio:3/4;border-radius:10px;position:relative;overflow:hidden;
    transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .book:hover .cover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.45)}
  .cover .ct{
    position:absolute;inset:0;padding:16px 14px;display:flex;flex-direction:column;
  }
  .cover .ttl{
    font-family:"Songti SC","SimSun",serif;font-size:19px;font-weight:700;
    color:rgba(255,255,255,.95);letter-spacing:.08em;line-height:1.4;
  }
  .cover .gen{margin-top:auto;font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.2em}
  .cover .band{width:26px;height:2px;background:rgba(255,255,255,.5);margin:8px 0}
  .c1{background:linear-gradient(160deg,#8C3B34,#5E2320)}
  .c2{background:linear-gradient(160deg,#2E4A6E,#1A2C44)}
  .c3{background:linear-gradient(160deg,#4A5A48,#2C362B)}
  .c4{background:linear-gradient(160deg,#6B5A7A,#413050)}
  .meta{margin-top:10px}
  .meta .nm{font-size:13px;font-weight:500;color:#D8D6D2}
  .meta .st{font-size:11px;color:#7C7B77;margin-top:3px}

  .add{
    aspect-ratio:3/4;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.04);color:#7C7B77;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    font-size:12px;border:none;font-family:inherit;transition:background .2s;
  }
  .add:hover{background:rgba(255,255,255,.08);color:#A9A7A2}
  .add svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="win">
  <div class="caption">
    <div class="app"><div class="logo">N</div>Novel Studio</div>
    <div class="win-controls">
      <button class="wbtn"><svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wbtn"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="wbtn close"><svg viewBox="0 0 12 12"><path d="M3 3 L9 9 M9 3 L3 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <div class="body">
    <div class="shelf-head">
      <h1>书架</h1>
      <span>4 部作品</span>
      <button class="new-book"><svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6"/></svg>新建作品</button>
    </div>

    <div class="grid">
      <button class="book">
        <div class="cover c1"><div class="ct"><div class="ttl serif">烬上花开</div><div class="band"></div><div class="gen">仙侠 · 卷一</div></div></div>
        <div class="meta"><div class="nm">烬上花开</div><div class="st">12 章 · 4.2 万字 · 2 小时前</div></div>
      </button>
      <button class="book">
        <div class="cover c2"><div class="ct"><div class="ttl serif">北纬三十七</div><div class="band"></div><div class="gen">都市 · 连载</div></div></div>
        <div class="meta"><div class="nm">北纬三十七</div><div class="st">3 章 · 8,600 字 · 昨天</div></div>
      </button>
      <button class="book">
        <div class="cover c3"><div class="ct"><div class="ttl serif">长风帖</div><div class="band"></div><div class="gen">武侠 · 存稿</div></div></div>
        <div class="meta"><div class="nm">长风帖</div><div class="st">27 章 · 11.4 万字 · 3 天前</div></div>
      </button>
      <button class="book">
        <div class="cover c4"><div class="ct"><div class="ttl serif">夜班出租车司机</div><div class="band"></div><div class="gen">悬疑 · 卷二</div></div></div>
        <div class="meta"><div class="nm">夜班出租车司机</div><div class="st">8 章 · 3.1 万字 · 上周</div></div>
      </button>
      <button class="add">
        <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4"/></svg>
        新建作品
      </button>
    </div>
  </div>
</div>
</body>
</html>
